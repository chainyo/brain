min_version = "2026.6.0"

[settings]
# QMD launches with Node and includes native modules, so its installer must use
# the same runtime ABI. Bun remains available for projects and other tooling.
npm.package_manager = "npm"

[tools]
actionlint = "1"
age = "1"
awscli = "2"
bun = "1.3"
chezmoi = "2"
codex = "latest"
gh = "latest"
"github:mongodb/kingfisher" = "latest"
helm = "4"
jq = "1"
kubectl = "latest"
node = "24"
"npm:@tobilu/qmd" = { version = "latest", npm_args = "--ignore-scripts=false" }
opentofu = "1"
python = "3.14"
rclone = "1"
restic = "latest"
ripgrep = "15"
shellcheck = "0.11"
sops = "3"
uv = "latest"
yq = "4"
